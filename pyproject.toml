[project]
name = "ml-ops-project"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Anton Jansson", email = "anton46304@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.6.0",
    "faiss-cpu>=1.15.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
ml-ops-project = "ml_ops_project:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
